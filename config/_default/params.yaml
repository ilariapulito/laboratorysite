# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    name: "Neural Engineering Laboratory"
    organization: "Cajal Neuroscience Center - Spanish National Research Council (CSIC)"
    type: organization 
    tagline: "Neuroengineering motor control and personalized rehabilitation"
    description: "We combine neurophysiological recordings, wearable sensors, artificial intelligence, and neural interfaces to study and modulate motor control. Our research develops personalized therapies for pathological tremor, identifies muscle synergies as biomarkers of impaired motor control, and advances EMG-driven robotic exoskeletons for gait rehabilitation after neurological injury."
    social:
      linkedin: "centro-de-neurociencias-cajal-csic" 

  # ────────────────────────────────────────────────────────────────────────────
  # THEME
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    mode: system
    pack: "default"
    colors:
      primary: "indigo"  # Blu/Indaco professionale per ambiente accademico
      secondary: "teal"   # Verde/Ottanio per accenti scientifici
      neutral: "slate"   # Toni di grigio puliti
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
        footer:
          background: ""
          foreground: ""

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    # Opzioni font consigliate per ambiti scientifici: 'academic', 'modern', o 'minimal'
    pack: "academic"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    radius: "md"
    spacing: "spacious"
    avatar_shape: circle

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
      text: ""
      url: ""

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER & COPYRIGHT
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal
    language_switcher: false
    text: ""

  copyright:
    notice: "© {year} {name}. CSIC."
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  # ────────────────────────────────────────────────────────────────────────────
  # SEO
  # ────────────────────────────────────────────────────────────────────────────
  seo:
    title: "Neural Engineering Laboratory | Cajal Institute CSIC"
    location:
      address:
        street: "Avenida Doctor Arce 37"
        city: "Madrid"
        region: "Madrid"
        postal_code: "28802"
        country: "ES"
      coordinates:
        latitude: 40.4465
        longitude: -3.6845
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: "Guidance for AI crawlers."
      contact: ""

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT & OTHER SETTINGS
  # ────────────────────────────────────────────────────────────────────────────
  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: false
    citations:
      style: ieee # Formato citazioni accademico (IEEE o APA)

  search:
    enable: true
    suggestions: []
    quick_actions: []

  comments:
    enable: false
    provider: ""

  analytics:
    google:
      measurement_id: ""

  verification:
    google: ""

  repository:
    enable: false
    url: ""

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow # Necessario per caricare l'iframe di Google Maps
    permissions_policy: ""

  privacy:
    enable: false
    anonymize_analytics: true

  debug:
    enable: false

  pro:
    hide_attribution: false
    affiliate_code: ""
